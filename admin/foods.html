<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food items — DishDash Admin</title>
  <meta name="description" content="Manage the DishDash menu — add, edit, delete and control availability.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-page" data-page="admin-foods">
  <div class="admin-shell">
    <aside id="ddAdminSide" class="admin-side"></aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-hamb" data-side-open aria-label="Open navigation"><svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg></button>
        <div>
          <h1>Food items</h1>
          <div class="at-sub">Manage the menu, pricing &amp; availability</div>
        </div>
        <div class="at-right">
          <a class="view-site-btn" href="../menu.html">
            <svg class="ic" aria-hidden="true"><use href="#i-arrow-r"></use></svg><span>View menu</span>
          </a>
          <button class="btn btn-primary btn-sm" id="addFoodBtn">
            <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg>Add food
          </button>
        </div>
      </header>
      <main class="admin-content">
        <div class="filters-bar">
          <form class="searchbar searchbar-sm" id="foodSearch" role="search" aria-label="Search foods">
            <svg class="ic s-ic" aria-hidden="true"><use href="#i-search"></use></svg>
            <input type="search" placeholder="Search by name or description…" aria-label="Search foods" id="foodQ">
          </form>
          <div class="field" style="min-width:170px"><label class="visually-hidden" for="catFilter">Category</label>
            <select class="input" id="catFilter"><option value="all">All categories</option></select>
          </div>
          <div class="field"><label class="visually-hidden" for="stockFilter">Availability</label>
            <select class="input" id="stockFilter">
              <option value="all">All availability</option>
              <option value="in">In stock</option>
              <option value="out">Sold out</option>
            </select>
          </div>
          <span class="results-meta" id="foodCount" style="margin-left:auto"></span>
        </div>
        <div id="foodsWrap">
          <div class="loader-box"><div class="big-spinner"></div><span>Loading menu…</span></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/vendor/supabase.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin/foods.js"></script>
</body>
</html>
