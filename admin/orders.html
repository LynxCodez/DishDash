<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — DishDash Admin</title>
  <meta name="description" content="Review and manage DishDash orders — update statuses as they progress.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../assets/js/boot.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-page" data-page="admin-orders">
  <div class="admin-shell">
    <aside id="ddAdminSide" class="admin-side"></aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-hamb" data-side-open aria-label="Open navigation"><svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg></button>
        <div>
          <h1>Orders</h1>
          <div class="at-sub">Review orders and move them through fulfilment</div>
        </div>
        <div class="at-right">
          <a class="view-site-btn" href="../index.html">
            <svg class="ic" aria-hidden="true"><use href="#i-arrow-r"></use></svg><span>View site</span>
          </a>
        </div>
      </header>
      <main class="admin-content">
        <div class="filters-bar">
          <form class="searchbar searchbar-sm" id="orderSearch" role="search" aria-label="Search orders">
            <svg class="ic s-ic" aria-hidden="true"><use href="#i-search"></use></svg>
            <input type="search" id="orderQ" placeholder="Search order id or customer…" aria-label="Search orders">
          </form>
          <span class="results-meta" id="orderCount" style="margin-left:auto"></span>
        </div>
        <div id="ordersWrap">
          <div class="loader-box"><div class="big-spinner"></div><span>Loading orders…</span></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/vendor/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/vendor/supabase.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin/orders.js"></script>
</body>
</html>
